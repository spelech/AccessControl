name: CI Quality Gates

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-verification:
    name: Release & Link Integrity Gate (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Version Synchronization & Link Integrity Gate
        run: python3 verify_release.py --ci --skip-tests

  backend:
    name: Backend Build & Test (.NET 10)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build backend
        run: dotnet build --configuration Release

      - name: Run tests with coverage
        run: dotnet test --configuration Release --no-build --collect:"XPlat Code Coverage" --results-directory ./TestResults

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: TestResults/**/coverage.cobertura.xml

  frontend:
    name: Frontend Quality & Layout (Node 22)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: src/CodeMaster.UI/package-lock.json

      - name: Install dependencies
        run: cd src/CodeMaster.UI && npm ci

      - name: Run ESLint
        run: cd src/CodeMaster.UI && npm run lint

      - name: Build frontend
        run: cd src/CodeMaster.UI && npm run build

      - name: Run Vitest Unit Tests
        run: cd src/CodeMaster.UI && (npm run test:coverage || npm test)

      - name: Run Playwright Layout Inspector
        run: |
          cd src/CodeMaster.UI
          npx playwright install --with-deps chromium
          npx playwright test

  smoke:
    name: Fullstack Integration Smoke Gate
    runs-on: ubuntu-latest
    needs: [backend, frontend, release-verification]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build backend
        run: dotnet build --configuration Release

      - name: Start server & probe health
        env:
          ASPNETCORE_URLS: "http://localhost:8150"
        run: |
          dotnet run --project src/CodeMaster.Web/CodeMaster.Web.csproj --configuration Release --no-build &
          APP_PID=$!
          echo "Server started with PID $APP_PID"

          for i in {1..30}; do
            if curl -s http://localhost:8150/health > /dev/null; then
              echo "Health check passed!"
              kill $APP_PID
              exit 0
            fi
            sleep 1
          done
          echo "Health check timed out!"
          kill $APP_PID
          exit 1
